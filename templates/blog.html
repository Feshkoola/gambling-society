<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambling Society</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='/assets/images/logo/favicon.png') }}"
    />
  </head>
  <body>
    <div class="header">
      <img
        src="{{ url_for('static', filename='assets/images/logo/logo.png') }}"
        alt="Gambling Society Logo"
        class="logoHeader"
      />
      <div class="navbar">
        <a href="/"
          ><div class="nav">
            <img
              class="navImage"
              src="{{ url_for('static', filename='assets/images/icons/home.svg') }}"
              alt="Home"
            />
            <div class="navText">HOME</div>
          </div></a
        >
        <a href="/blog"
          ><div class="nav">
            <img
              class="navImage"
              src="{{ url_for('static', filename='assets/images/icons/blog.svg') }}"
              alt="Blog"
            />
            <div class="navText selectedNavText">BLOG</div>
          </div></a
        >
        <a href="/dashboard"
          ><div class="nav">
            <img
              class="navImage"
              src="{{ url_for('static', filename='assets/images/icons/dashboard.svg') }}"
              alt="Dashboard"
            />
            <div class="navText">DASHBOARD</div>
          </div></a
        >
        <a href="/games"
          ><div class="nav">
            <img
              class="navImage"
              src="{{ url_for('static', filename='assets/images/icons/games.svg') }}"
              alt="Games"
            />
            <div class="navText">GAMES</div>
          </div></a
        >
      </div>
    </div>
    <div class="flex">
      <div class="content"></div>
    </div>
    <div class="footer">
      <div class="first">
        <div
          class="half"
          style="
            height: 70%;
            width: 49.91%;
            margin-bottom: 0px;
            border-bottom: var(--blue) solid 1px;
          "
        >
          <img
            src="{{url_for('static', filename='assets/images/logo/logo.png')}}"
            class="img"
            style="margin-top: 12%"
          />
        </div>
        <div
          class="half"
          style="
            height: 70%;
            margin-bottom: 0px;
            border-bottom: var(--blue) solid 1px;
            border-left: 1px var(--blue) solid;
          "
        >
          <p class="footerText">Terms and conditions PDF</p>
          <p class="footerText">Blunderbirds Link</p>
          <p class="footerText">The Lore documentation</p>
          <p class="footerText">General Rocketry Information</p>
        </div>
        <div class="full">
          <h2
            style="
              width: 100%;
              margin: 0px;
              margin-top: 5vh;
              text-align: center;
              color: var(--blue);
            "
          >
            © 2026 Gambling Society — All rights reserved.
          </h2>
        </div>
      </div>

      <div class="last">
        <img
          style="margin-left: 20%; width: 60%; float: left"
          src="{{url_for('static', filename='assets/images/homepage/sponsor logos/BTI.png')}}"
          class="img bti"
        />
        <img
          src="{{url_for('static', filename='assets/images/homepage/sponsor logos/Hevington.png')}}"
          class="img"
          style="width: 30%; float: left; margin-left: 10%; margin-right: 10%"
        />
        <img
          src="{{url_for('static', filename='assets/images/homepage/sponsor logos/Meeteor.png')}}"
          class="img"
          style="width: 30%; float: left; margin-left: 10%; margin-right: 10%"
        />
      </div>
    </div>
  </body>
</html>
